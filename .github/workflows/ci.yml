# GymConnect CI (Phase 12).
#
# Runs the same checks the phase workflow runs locally: formatting,
# analysis, the Flutter suite, and the Firestore security-rules suite on
# the emulator.
#
# Deliberately absent, and must stay absent:
#   * any `firebase deploy` step - rules are deployed manually only (D5,
#     docs/FIRESTORE_SECURITY.md)
#   * any real Firebase credentials, service-account JSON or API keys -
#     no repository secrets are referenced anywhere in this file
#   * any run of the demo or migration CLIs, which write to a real project
#
# The rules job runs against the offline `demo-gymconnect` project id, so
# it cannot reach the live project even by accident.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      # lib/firebase_options.dart is gitignored (it holds the project API
      # key), so a fresh checkout cannot resolve the import. These jobs
      # only analyze and run tests - nothing initialises Firebase - so a
      # keyless placeholder is enough.
      - name: Provide placeholder Firebase configuration
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cp tool/ci/firebase_options_stub.dart lib/firebase_options.dart
            echo "Copied CI placeholder into lib/firebase_options.dart"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # firebase-tools 15 refuses to start the emulator on anything older
      # than JDK 21 (docs/FIRESTORE_SECURITY.md records the same
      # requirement for local runs).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-tools
        run: npm install --global firebase-tools@15

      - name: Install rules-test dependencies
        run: npm --prefix test_rules ci

      # Starts the Firestore emulator for the offline demo project and runs
      # the suite against it; never contacts the live project.
      - name: Run rules suite
        run: npm --prefix test_rules test
